services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: weather
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weather"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: weather
      DB_USERNAME: weather
      DB_PASSWORD: weather
      HISTORY_DAYS: ${HISTORY_DAYS:-92}
    volumes:
      - storage:/app/storage

volumes:
  pgdata: {}
  storage: {}
